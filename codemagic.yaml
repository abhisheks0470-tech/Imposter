workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Analyze project
        script: |
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        script: |
          flutter test

      - name: Set up Android release signing
        script: |
          if [ -n "$CM_KEYSTORE" ] && [ -n "$CM_KEYSTORE_PASSWORD" ] && [ -n "$CM_KEY_ALIAS" ] && [ -n "$CM_KEY_PASSWORD" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > android/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF
          elif [ -f android/upload-keystore.jks ] && [ -f android/key.properties ]; then
            echo "Using repository Android release keystore."
          else
            echo "Release signing is missing."
            echo "Either set CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, and CM_KEY_PASSWORD in Codemagic, or commit android/upload-keystore.jks and android/key.properties."
            exit 1
          fi

      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release

      - name: Build Android APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/flutter-apk/app-release.apk

    publishing:
      email:
        recipients:
          - abhishek.s0470@gmail.com
        notify:
          success: true
          failure: true
